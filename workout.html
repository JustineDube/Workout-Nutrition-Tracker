<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack — Log Workout</title>
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <header id="main-header"></header>

    <main>
      <div class="container">
        <h1>Log Workout</h1>

        <form id="workout-form" class="card">
          <div class="form-row">
            <div class="field">
              <label for="workout-date">Date</label>
              <input type="date" id="workout-date" required />
            </div>
            <div class="field">
              <label for="workout-duration">Duration (minutes)</label>
              <input type="number" id="workout-duration" min="1" max="600" placeholder="45" />
            </div>
          </div>

          <h2>Exercises</h2>
          <div id="workout-exercises"></div>

          <div class="form-row mt-1">
            <div class="field">
              <label for="custom-exercise-name">Add a custom exercise</label>
              <input type="text" id="custom-exercise-name" placeholder="e.g. Farmer's Carry" />
            </div>
            <button type="button" class="btn btn-secondary" id="add-custom-exercise-btn">Add</button>
          </div>

          <p class="error-message mt-1" id="workout-error" hidden>Add at least one exercise before saving your workout.</p>
          <p class="empty-message mt-1" id="workout-saved-message" hidden>
            Workout saved! View it on the <a href="/history.html">History</a> page.
          </p>

          <button type="submit" class="btn btn-primary mt-1">Save Workout</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>FitTrack &mdash; WDD 330 Final Project</p>
      </div>
    </footer>

    <script type="module" src="/src/js/workout.js"></script>
  </body>
</html>
